<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 72% 18%,#123f31 0,transparent 30%),#06100e;color:#f1fff8;font-family:Arial,sans-serif}.frame{height:100%;display:flex;flex-direction:column;justify-content:center;padding:110px 150px;position:relative}.mark{width:72px;height:72px;border:1px solid #58e6a1;border-radius:20px;display:grid;place-items:center;color:#58e6a1;font-size:38px;margin-bottom:40px}.eyebrow{color:#58e6a1;letter-spacing:.22em;text-transform:uppercase;font-size:20px;font-weight:700}h1{font-size:112px;line-height:.92;margin:24px 0;letter-spacing:-.06em}h1 span{color:#58e6a1}p{font-size:30px;line-height:1.45;color:#b5c9c0;max-width:920px}.line{position:absolute;left:150px;right:150px;bottom:80px;height:1px;background:#21463a}.network{position:absolute;right:150px;bottom:45px;color:#7f9b90;letter-spacing:.15em;text-transform:uppercase}
  </style>
</head>
<body><main class="frame"><div class="mark">S</div><div class="eyebrow">Built on Stellar</div><h1>S<span>Pulse</span></h1><p>Transparent, non-custodial prediction markets powered by Soroban.</p><div class="line"></div><div class="network">GrantFox pitch</div></main></body>
</html>
